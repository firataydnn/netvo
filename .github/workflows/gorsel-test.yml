# NETVO — Görsel sağlayıcı testi (Pixabay + Higgsfield). Elle tetiklenir.
# İki sağlayıcıyı da gerçek anahtarlarla dener, örnek görselleri commit eder.
name: Gorsel Test
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: SDK kur (Higgsfield)
        run: npm install @higgsfield/client
      - name: Sağlayıcıları test et
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
        run: node icerik/gorsel_test.mjs
      - name: Örnek görselleri commit et
        run: |
          git config user.name "netvo-bot"
          git config user.email "bot@netvo"
          git add marka/haber-gorsel/_test_pixabay.jpg marka/haber-gorsel/_test_higgsfield.jpg marka/haber-gorsel/_test_result.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "test: gorsel saglayici ciktilari"
          git push || echo "degisiklik yok"
