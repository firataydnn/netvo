# NETVO — Görsel sağlayıcı testi (Pixabay + Higgsfield). Elle tetiklenir.
# İki sağlayıcıyı da gerçek anahtarlarla dener, örnek görselleri commit eder.
name: Gorsel Test
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: SDK kur (Higgsfield)
        run: npm install @higgsfield/client
      - name: Sağlayıcıları test et
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
        run: |
          set +e
          node icerik/gorsel_test.mjs > out.txt 2>&1
          echo "exit_code=$?" >> out.txt
          echo '## Görsel sağlayıcı testi' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat out.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 0
