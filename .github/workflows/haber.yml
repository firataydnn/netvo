# NETVO — günlük içerik motoru (haber)
# Her sabah 06:00 UTC'de e-ticaret haberlerini tarar, satıcının parasını
# etkileyenleri marka tonunda yazıp icerik/haberler.json'a ekler, commit eder.
# Deploy (Cloudflare Pages) push'ta otomatik yeniden yayınlar.
#
# Gerekli secret: ANTHROPIC_API_KEY (Settings → Secrets → Actions).
# Anahtar yoksa script şablon-fallback ile yine çalışır (LLM'siz).

name: Günlük Haber
on:
  schedule:
    - cron: "0 6 * * *"      # her gün 06:00 UTC
  workflow_dispatch: {}       # elle de tetiklenebilir

permissions:
  contents: write

jobs:
  haber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Haberleri üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node icerik/haber_uret.mjs
      - name: Günlük bülteni gönder (Resend)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node icerik/mail_gonder.mjs || echo "bülten atlandı (anahtar yok veya hata)"
      - name: Yayına kopyala (site kökü /data/)
        run: |
          mkdir -p seo/site/data
          cp icerik/haberler.json seo/site/data/haberler.json 2>/dev/null || echo "yeni haber yok"
      - name: Commit
        run: |
          git config user.name "netvo-bot"
          git config user.email "bot@netvo"
          git add icerik/haberler.json seo/site/data/haberler.json marka/haber-gorsel 2>/dev/null || true
          git diff --cached --quiet || git commit -m "içerik: günlük haber güncellemesi"
          git push || echo "değişiklik yok"
